name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset gcc-release
      - run: cmake --build --preset gcc-release
      - run: ./scripts/run_golden_tests.sh build/gcc-release/kwic

  fuzz-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - run: cmake --preset fuzz
      - run: cmake --build --preset fuzz
      - run: ./build/fuzz/kwic_fuzz_tokenize_line -max_total_time=60 -max_len=256